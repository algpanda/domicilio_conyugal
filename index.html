<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chulapa & Chuleta">
  <title>Chulapa & Chuleta</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="firebase-recipes.js" type="module"></script>
  <script src="app-install.js" defer></script>
</head>
<body>
  <main id="access-screen" class="access-screen">
    <form id="access-form" class="access-card">
      <div class="brand-mark" aria-hidden="true">⌂</div>
      <p class="eyebrow">NUESTRA COCINA</p>
      <h1>Todas nuestras recetas<br>siempre en orden.</h1>
      <p class="muted">Introduce el código de acceso para continuar.</p>
      <label class="sr-only" for="access-code">Código de acceso</label>
      <input id="access-code" class="code-input" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="••••" maxlength="12" required>
      <p id="access-error" class="error-message" role="alert" aria-live="polite"></p>
      <button class="button button-primary button-wide" type="submit">Entrar en la cocina <span aria-hidden="true">→</span></button>
      <p class="fine-print">Un recetario personal.</p>
    </form>
  </main>
  <div id="app" class="app-shell" hidden>
    <header class="topbar">
      <a class="wordmark" href="#inicio" aria-label="Casa en orden, inicio"><span class="brand-mark small" aria-hidden="true">⌂</span> chulapa<span>& chuleta</span></a>
      <button id="lock-button" class="text-button" type="button">Bloquear <span aria-hidden="true">↗</span></button>
    </header>
    <main id="inicio" class="dashboard">
      <section class="welcome-row">
        <div><p class="eyebrow">NUESTRA COCINA · <span id="today"></span></p><h1>Hola, <span class="serif">¿qué te apetece comer?</span></h1><p class="muted">Un recetario personal.</p></div>
        <div class="welcome-art" aria-hidden="true"><span>✳</span><span>☼</span></div>
      </section>
      <section class="content-grid">
      </section>
      <footer class="footer-note"><span aria-hidden="true">✿</span> En esta casa se come rico todos los días.</footer>
    </main>
  </div>
</body>
</html>
